<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=", initial-scale=1.0">
    <title>Regisztráció</title>
</head>
<body>
    <h1>
        Regisztráció
    </h1>

    <form action="#" method="get">
        <label for = "nev">Név</label> <br>
        <input type = "text" name = "Név" id = "nev" placeholder = "pl.: Szakács István" required> <br>
        
        <label for="email">E-mail</label><br>
        <input type="email" name="E-mail" id="email" placeholder="abc@something.com" required><br>

        <label for="tel">Telefonszám</label><br>
        <input type="tel" name="Telefonszám" id="tel" placeholder="+36 30 298 1245" minlength="12" maxlength="13" required><br>

        <label for="age">Életkor</label><br>
        <input type="number" name="age" id="age" min="0" max="120" required><br>

        <label for="nem">Férfi</label>
        <input type="radio" name="Nem" id="férfi" class="nem"><br>

        <label for="nem">Nő</label>
        <input type="radio" name="Nem" id="nő" class="nem"><br>

        <label for="darab">Mennyiség</label>
        <input type="range" min="1" max="5" name="Darab" id="darab" value="5"><br>

        <label for="hobbi">Foci</label>
        <input type="checkbox" name="sprots" id="footballt" value="Foci">
        <label for="hobbi">F1</label>
        <input type="checkbox" name="sprots" id="F1" value="F1"><br>

        <button type="submit">Regisztrálás</button>
    </form>
</body>
</html>
